name: Build and Publish VeloSearch Studio Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pypdfium2 pyinstaller

      - name: Run Verification Test Suite
        run: |
          python test_suite.py

      - name: Build VeloSearch Studio Executable and Setup Installer
        run: |
          python build_installer.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/VeloSearchStudio.exe
            dist/VeloSearchStudio_Setup.exe
            dist/*.zip
            github/version.json
          body_path: github/RELEASE_v1.4.0.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
